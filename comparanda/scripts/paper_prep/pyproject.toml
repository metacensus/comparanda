[project]
name = "paper-prep"
version = "0.1.0"
description = "PDF → structured bundle preprocessor for Comparanda (Docling + per-table Sonnet + Stage-2 LLM arbiter)"
readme = "README.md"
authors = [{ name = "MetaCensus" }]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.0",
    "pydantic>=2.0",
]

[project.urls]
Repository = "https://github.com/metacensus/comparanda"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv_build]
module-name = "paper_prep"
module-root = "src"

[build-system]
requires = ["uv_build>=0.9.20,<0.10.0"]
build-backend = "uv_build"
