[project]
name = "harness"
version = "0.1.0"
description = "Calibration harness for Comparanda — evaluates and improves agent instructions"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "MetaCensus" }]
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/metacensus/comparanda"

[project.scripts]
harness-commit = "harness.git_wrapper.commit:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv_build]
module-name = "harness"

[build-system]
requires = ["uv_build>=0.9.20,<0.10.0"]
build-backend = "uv_build"
