[project]
name = "harness"
version = "0.1.0"
description = "Calibration harness for Comparanda — evaluates and improves agent instructions"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv_build]
module-name = "harness"

[build-system]
requires = ["uv_build>=0.9.20,<0.10.0"]
build-backend = "uv_build"
