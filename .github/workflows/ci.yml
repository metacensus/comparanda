name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Inner-loop tests
        working-directory: comparanda
        run: uv run --python 3.12 --with pytest --with pymupdf pytest tests -q
      - name: Harness tests
        working-directory: harness
        run: uv run pytest -q
      - name: Paper-prep tests
        working-directory: comparanda/scripts/paper_prep
        run: uv run pytest -q

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::Commit $c is missing 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s' (or 'git rebase --signoff $BASE'). See CONTRIBUTING.md."
            exit 1
          fi
